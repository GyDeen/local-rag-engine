# Deployment HTTP stack: the image carries the code. models and index persist.
#
#   docker compose build
#   docker compose up -d ollama
#   docker compose exec ollama ollama pull qwen3:4b
#   docker compose run --rm app python -m rag_engine.cli.index  # Build the vector database index
#   docker compose up -d app                              # http://localhost:8000/docs
#
# For the live-edit developer setup, use compose.dev.yaml instead.

name: local-rag

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_NUM_PARALLEL: "${OLLAMA_NUM_PARALLEL:-1}"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      context: .
      target: runtime
    image: local-rag:local
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen3:4b}"
      RAG_RETRIEVAL_ONLY: "${RAG_RETRIEVAL_ONLY:-0}"
      RAG_GENERATION_CONCURRENCY: "${RAG_GENERATION_CONCURRENCY:-1}"
      RAG_GENERATION_QUEUE_SIZE: "${RAG_GENERATION_QUEUE_SIZE:-32}"
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-0}"
      ANONYMIZED_TELEMETRY: "False"
    volumes:
      - vector-db:/app/data/vector_db
      - hf-cache:/cache/huggingface
      - ./output:/app/output
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5).close()"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 5m

volumes:
  ollama-models:
  vector-db:
  hf-cache:
